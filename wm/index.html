<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>★★★★★★★★★★★★★</title>

  <link rel="shortcut icon" href="mwm.ico" type="image/x-icon">
  <link rel="icon" type="image/x-icon" href="mwm.ico?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: rgba(0, 36, 36, 0.973);
      --text-main: oklch(99.733% 0.00913 113.424);
      --text-title: oklch(99.733% 0.00913 113.424 / 0.981);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%; height: 100%;
      background-color: var(--bg-dark); color: var(--text-main);
      font-family: 'Familjen Grotesk', sans-serif;
      overflow: hidden; cursor: none;
    }
    body.modo-manual { cursor: auto; }

    /* Cortina Mestra (1.5s de pura elegância) */
    #blackout {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #000; z-index: 9999; opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease-in-out, background-color 1.5s ease;
    }
    #blackout.ativo { opacity: 1; pointer-events: all; }

    /* Tela Inicial */
    #bg-video-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
    }
    #bg-video-container video {
      width: 100%; height: 100%; object-fit: cover; filter: brightness(1.13);
    }
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
      z-index: 10;
    }
    #start-overlay h1 {
      color:rgba(242, 255, 142, 0.69); font-weight: 600; 
      font-size: calc(clamp(3.75rem, 6.25vw, 7.5rem) * 2.08); /* +25% */
      width: 94vw; text-align: center; margin-bottom: 13vh;
      letter-spacing: -0.04em; cursor: pointer;
      opacity: .13; filter: blur(6px);
      transition: color 3.8s, opacity 6.6s, filter 4.2s, letter-spacing 8.8s, font-weight 13s;
    }
    #start-overlay h1:hover { color: var(--bg-dark); opacity: 0.24; filter: blur(8px); letter-spacing: -0.024em; font-weight: 800; }

/* Grid de Letreiros (Centralizado e Snap) */
    #grid-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--bg-dark); z-index: 20;
      display: none; flex-direction: column;
      overflow-y: auto; scroll-snap-type: y mandatory; scroll-behavior: smooth;
      scrollbar-width: none; 
      padding: 33.33vh 0; /* Permite que o topo e a base parem no centro exato */
    }
    #grid-screen::-webkit-scrollbar { display: none; }
    
    .grid-item {
      display: flex; justify-content: space-between; align-items: baseline;
      min-height: 25vh; padding: 0 66px; 
      scroll-snap-align: center; scroll-behavior: smooth; 
      pointer-events: none; /* Mata o clique no buraco vazio */
    }

    .grid-item:hover .grid-titulo, 
    .grid-item:hover .grid-ano { 
      color: rgba(213, 255, 142, 0.88);
      filter: blur(1px);
    }
    
    .grid-titulo { 
      font-weight: 700; text-align: left; color: var(--text-title); 
      font-size: calc(clamp(2.6rem, 6.5vw, 6.5rem) + 6px); /* +30% */
      letter-spacing: -0.013em;
      pointer-events: auto; /* Devolve o clique para o título */
      cursor: pointer; 
      transition: color 0.18s, filter 0.24s;
    }
    
    .grid-ano { 
      font-weight: 500; text-align: right; color: var(--text-main);
      font-size: clamp(1rem, 2.5vw, 2.5rem); 
      pointer-events: auto; /* Devolve o clique para o ano */
      cursor: pointer; 
      letter-spacing: 0.013em;
      transition: color 0.24s, filter 0.38s;
    }

    /* Exibição */
    #exhibition-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: none; z-index: 5; background: transparent;
      justify-content: center; align-items: center;
    }
    #media-container {
      position: relative; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
    }
    iframe, video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

    /* Capa Mágica do YouTube */
    #magic-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; cursor: pointer; display: none;
    }
    body.modo-manual #magic-overlay { display: block; }

/* Container do carrossel */
    #gallery-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      scroll-behavior: smooth;
      background-color: var(--text-title);
    }
    #gallery-container::-webkit-scrollbar { display: none; }

    /* Cada slide ocupa a tela inteira (100vw) */
    .gallery-slide {
      flex: 0 0 100vw;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    /* A foto fica cravada em 100vh no centro do slide */
    .gallery-slide img { 
      height: 100vh;
      width: auto;
      max-width: 100vw;
      object-fit: contain;
      cursor: default;
      user-select: none;
    }

    /* Rodapé Invisível */
    #footer-nav {
      position: absolute; bottom: -100px; left: 0; width: 100%;
      padding: 1.5rem; background: linear-gradient(to top, var(--bg-dark) 0%, transparent 100%);
      z-index: 50; display: flex; justify-content: space-between;
      transition: bottom 0.3s ease; font-weight: 300;
    }
    #footer-nav.visivel { bottom: 0; }
  </style>
</head>
<body>

  <div id="blackout"></div>

  <div id="bg-video-container">
    <video id="home-video" src="https://umpedrogallego.github.io/site/midia/6x1-pingpong.webm" muted autoplay playsinline loop></video>
  </div>

  <div id="start-overlay">
    <h1 id="btn-iniciar" style="margin-bottom: 24vh;">PEDRO GALLEGO</h1>
  </div>

  <div id="grid-screen"></div>

  <div id="exhibition-screen">
    <div id="media-container">
      <div id="magic-overlay"></div> 
    </div>
  </div>

  <div id="footer-nav">
    <span id="footer-title">Obra</span>
    <span id="footer-status">SEAMLESS</span>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="config.js"></script>

  <script>
    let ytPlayer = null;
    let obraAtiva = null;
    let indexAtual = 0;
    let timeChecker = null;
    let currentSegment = 0;
    
    let modoManual = false;
    let modoEspera = false;
    let galeriaIndex = 0;

    const dom = {
      blackout: document.getElementById('blackout'),
      startOverlay: document.getElementById('start-overlay'),
      gridScreen: document.getElementById('grid-screen'),
      exhibitionScreen: document.getElementById('exhibition-screen'),
      mediaContainer: document.getElementById('media-container'),
      magicOverlay: document.getElementById('magic-overlay'),
      btnIniciar: document.getElementById('btn-iniciar'),
      homeVideo: document.getElementById('home-video')
    };

// --- GRID ÚNICO ---
    function montarGrid() {
      if (typeof APRESENTACAO === 'undefined') return;
      
      APRESENTACAO.forEach((obra, index) => {
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.innerHTML = `<span class="grid-titulo">${obra.titulo}</span> <span class="grid-ano">${obra.ano}</span>`;
        item.onclick = () => {
          indexAtual = index;
          iniciarTransicaoObra();
        };
        dom.gridScreen.appendChild(item);
      });
    }

    // --- NAVEGAÇÃO E TRANSIÇÕES ---
    dom.btnIniciar.addEventListener('click', () => {
      // APAGUE ESTA LINHA DO SEU CLIQUE INICIAL:
      // if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
      indexAtual = 0;
      iniciarTransicaoObra();
    });

    function retornarAoInicio() {
      dom.blackout.style.backgroundColor = '#000000';
      dom.blackout.classList.add('ativo');
      
      setTimeout(() => {
        limparMedia();
        modoEspera = false;
        dom.exhibitionScreen.style.display = 'none';
        dom.gridScreen.style.display = 'none';
        dom.startOverlay.style.display = 'flex';
        
        // Garante que o vídeo do fundo não morreu
        dom.homeVideo.play().catch(() => {});
        
        setTimeout(() => dom.blackout.classList.remove('ativo'), 1000);
      }, 1500);
    }

    function iniciarTransicaoObra() {
      obraAtiva = APRESENTACAO[indexAtual];
      modoEspera = false;
      document.getElementById('footer-title').innerText = `${obraAtiva.titulo} (${obraAtiva.ano})`;

      // A cortina assume a cor da obra QUE VAI ENTRAR
      dom.blackout.style.backgroundColor = obraAtiva.fadeColor || '#000000';
      dom.blackout.classList.add('ativo');

      setTimeout(() => {
        dom.gridScreen.style.display = 'none';
        dom.startOverlay.style.display = 'none';
        dom.exhibitionScreen.style.display = 'flex';
        limparMedia();

        if (obraAtiva.provedor === 'youtube') carregarYouTube(obraAtiva);
        else if (obraAtiva.provedor === 'vimeo') carregarVimeo(obraAtiva);
        else if (obraAtiva.tipo.includes('galeria')) carregarGaleria(obraAtiva);

        // Se for galeria, não depende do YT para liberar o fadeout
        if (obraAtiva.provedor !== 'youtube') {
          setTimeout(() => dom.blackout.classList.remove('ativo'), 500);
        }
      }, 1500); // 1.5s é o tempo mágico da cortina preencher tudo
    }

    function entrarEmEspera() {
      modoEspera = true;
      // Fade out de saída = Cor da própria obra
      dom.blackout.style.backgroundColor = obraAtiva?.fadeColor || '#000000';
      dom.blackout.classList.add('ativo');
      // Destrói o iframe oculto para não pesar
      setTimeout(limparMedia, 1500);
    }

    function limparMedia() {
      if (timeChecker) clearInterval(timeChecker);
      if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy();
      
      Array.from(dom.mediaContainer.children).forEach(child => {
        if(child.id !== 'magic-overlay') child.remove();
      });
      ytPlayer = null;
    }
// Crie essa variável junto com as outras lá em cima
    let pulandoSegmento = false;

    // 1. O onStateChange corrigido (com a trava)
    function carregarYouTube(obra) {
      const div = document.createElement('div');
      div.id = 'yt-player-div';
      dom.mediaContainer.insertBefore(div, dom.magicOverlay);
      currentSegment = 0;
      pulandoSegmento = false;
      
      let startSeconds = obra.tipo === 'video-sequenciado' ? obra.segmentos[0].start : obra.inicio;

      ytPlayer = new YT.Player('yt-player-div', {
        videoId: obra.videoId,
        playerVars: {
          controls: 0, disablekb: 1, modestbranding: 1, rel: 0, showinfo: 0, fs: 0,
          cc_load_policy: obra.desabilitarLegenda ? 0 : 1, start: startSeconds
        },
        events: {
          'onReady': (e) => {
            e.target.setPlaybackQuality(obra.qualidade || 'hd1080');
            e.target.playVideo();
          },
          'onStateChange': (event) => {
            // Se estiver no meio de um salto, NÃO deixa abrir a cortina aqui!
            if (event.data === YT.PlayerState.PLAYING && dom.blackout.classList.contains('ativo')) {
              if (!pulandoSegmento) {
              setTimeout(() => {
                dom.blackout.classList.remove('ativo');
              }, 4242); 
            }
              if (!modoManual) {
                clearInterval(timeChecker);
                timeChecker = setInterval(obra.tipo === 'video-sequenciado' ? checarSaltosYT : checarFimYT, 100);
              }
            }
          }
        }
      });
    }


    function carregarVimeo(obra) {
      const iframe = document.createElement('iframe');
      iframe.id = 'vimeo-player-iframe';
      // Parâmetros para esconder controles, deixar autoplay e loop se quiser
      iframe.src = `https://player.vimeo.com/video/${obra.vimeoId}?autoplay=1&muted=0&controls=0`;
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.allow = 'autoplay; fullscreen; picture-in-picture';
      
      dom.mediaContainer.insertBefore(iframe, dom.magicOverlay);

      // Como o Vimeo não tem o onStateChange do YouTube, 
      // tiramos a cortina depois que ele dispara o embed (ex: 1.5s)
      setTimeout(() => {
        if (dom.blackout.classList.contains('ativo')) {
          dom.blackout.classList.remove('ativo');
        }
      }, 2000);
    }

    // 2. O checarSaltosYT com a trava acionada
    function checarSaltosYT() {
      if (!ytPlayer || !ytPlayer.getCurrentTime) return;
      const currentTime = ytPlayer.getCurrentTime();
      const targetEnd = obraAtiva.segmentos[currentSegment].end;

      // 2s antes, sobe o blackout
      if (targetEnd - currentTime <= 2.0 && !dom.blackout.classList.contains('ativo')) {
        dom.blackout.style.backgroundColor = '#000000';
        dom.blackout.classList.add('ativo');
      }

      if (currentTime >= targetEnd) {
        clearInterval(timeChecker);
        currentSegment++;

        if (currentSegment < obraAtiva.segmentos.length) {
          pulandoSegmento = true; // TRAVA A CORTINA! Ninguém encosta nela
          
          ytPlayer.seekTo(obraAtiva.segmentos[currentSegment].start, true);
          ytPlayer.playVideo();

          // Agora sim o seu tempo manda de verdade!
          // 2500ms é perfeito pro YouTube engolir a barra no escuro
          setTimeout(() => {
            pulandoSegmento = false; // Libera
            dom.blackout.classList.remove('ativo'); // Abre a cortina
            timeChecker = setInterval(checarSaltosYT, 100);
          }, 5050);

        } else {
          entrarEmEspera();
        }
      }
    }

    
    function checarFimYT() {
      if (!ytPlayer || !ytPlayer.getDuration) return;
      if (ytPlayer.getDuration() - ytPlayer.getCurrentTime() <= 2.0) {
        if(!dom.blackout.classList.contains('ativo')) entrarEmEspera();
      }
    }

    // --- GALERIA ---
    function carregarGaleria(obra) {
      const galeria = document.createElement('div');
      galeria.id = 'gallery-container';
      galeriaIndex = 0;
      
      obra.imagens.forEach((src) => {
        const slide = document.createElement('div');
        slide.className = 'gallery-slide';
        
        const img = document.createElement('img');
        img.src = src;
        
        slide.appendChild(img);
        galeria.appendChild(slide);
      });

      dom.mediaContainer.insertBefore(galeria, dom.magicOverlay);
      
      setTimeout(() => {
        const slides = galeria.querySelectorAll('.gallery-slide');
        if (slides[0]) slides[0].scrollIntoView({ behavior: 'smooth', inline: 'start' });
      }, 50);
    }

    dom.magicOverlay.addEventListener('click', () => {
      if (obraAtiva?.provedor === 'youtube' && ytPlayer) {
        ytPlayer.getPlayerState() === 1 ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
      }
    });

    // --- ATALHOS ---
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey) return;

      switch(e.key) {
        case '\\': 
          document.getElementById('footer-nav').classList.toggle('visivel'); break;

        case 'b':
        case 'B':
          modoManual = !modoManual;
          document.body.classList.toggle('modo-manual', modoManual);
          document.getElementById('footer-status').innerText = modoManual ? "MANUAL" : "SEAMLESS";
          
          if (!modoManual && ytPlayer && ytPlayer.getPlayerState() === 1) {
            clearInterval(timeChecker);
            timeChecker = setInterval(obraAtiva?.tipo === 'video-sequenciado' ? checarSaltosYT : checarFimYT, 100);
          }
          break;

        case 'g':
        case 'G':
          dom.blackout.style.backgroundColor = '#000000';
          dom.blackout.classList.add('ativo');
          
          setTimeout(() => {
            limparMedia(); modoEspera = false;
            dom.exhibitionScreen.style.display = 'none';
            dom.gridScreen.style.display = 'flex';
            
            // Pula pro bloco B centralizado
            const itens = document.querySelectorAll('.grid-item');
            const target = itens[indexAtual + APRESENTACAO.length]; 
            if(target) target.scrollIntoView({ block: 'center', behavior: 'smooth' });
            
            setTimeout(() => dom.blackout.classList.remove('ativo'), 500);
          }, 1500);
          break;

        case ' ': // Play/Pause
          if (dom.gridScreen.style.display === 'flex' || dom.startOverlay.style.display === 'flex') return;
          e.preventDefault(); 
          dom.magicOverlay.click();
          break;

        case 'ArrowRight':
        case 'ArrowLeft':
          const dir = e.key === 'ArrowRight' ? 1 : -1;
          
          // 1. Sair da Galeria ou avançar da Espera (Continua igual)
          if ((e.shiftKey && e.key === 'ArrowRight' && obraAtiva?.tipo.includes('galeria')) || (modoEspera && e.key === 'ArrowRight')) {
            indexAtual++;
            if (indexAtual >= APRESENTACAO.length) {
              retornarAoInicio();
            } else {
              iniciarTransicaoObra();
            }
            return;
          }

          // 2. Navegação na Galeria (Se for galeria, seta muda de foto)
          if (obraAtiva?.tipo.includes('galeria')) {
            const galeria = document.getElementById('gallery-container');
            if (galeria) {
              const slides = galeria.querySelectorAll('.gallery-slide');
              galeriaIndex = Math.max(0, Math.min(galeriaIndex + dir, slides.length - 1));
              slides[galeriaIndex].scrollIntoView({ behavior: 'smooth', inline: 'start' });
            }
          } 
          // 3. Modo Manual em Vídeos (Com saltos diferentes para Seta Pura vs Shift + Seta)
          else if (modoManual) {
            // Se apertar Shift junto, pula 5 segundos. Se for só a seta, pula 30 segundos!
            const segundosPulo = e.shiftKey ? 5 : 30;

            if (obraAtiva?.provedor === 'youtube' && ytPlayer) {
              ytPlayer.seekTo(ytPlayer.getCurrentTime() + (segundosPulo * dir), true);
            } else {
              const vid = dom.mediaContainer.querySelector('video');
              if (vid) vid.currentTime += (segundosPulo * dir);
            }
          }
          break;
      }
    });

    window.addEventListener('load', montarGrid);
  </script>

<!-- ATALHOS DIRETOS (MODO ABERTO / TECLA B) -->
  <script>
    (function() {
      const mapaObras = {
        'f': 'ficcao',
        'a': 'acordo',
        't': 'torcida',
        'n': 'nada machuca',
        'd': 'domingo maior',
        's': 'screensaver'
      };

      function normalizar(texto) {
        return (texto || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/\s+/g, '');
      }

      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.altKey || e.metaKey) return;

        // Só executa se o modo manual estiver ativo (mouse visível)
        if (!document.body.classList.contains('modo-manual')) return;

        const tecla = e.key.toLowerCase();
        const termoBusca = mapaObras[tecla];

        if (termoBusca && typeof APRESENTACAO !== 'undefined') {
          const termoLimpo = normalizar(termoBusca);
          const indexAlvo = APRESENTACAO.findIndex(obra => 
            normalizar(obra.titulo).includes(termoLimpo)
          );

          if (indexAlvo !== -1) {
            e.preventDefault();
            indexAtual = indexAlvo;
            iniciarTransicaoObra();
          }
        }
      });
    })();
  </script>

</body>
</html>
