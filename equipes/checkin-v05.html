                        ${innerHtml}
                        <span class="swipe-cue is-right" aria-hidden="true">›</span>
                    </div>
                </div>
            `;
        }).join('');

        bindRosterEvents();
    }

    // 6. Atualiza Rodapé Discreto (Contagem + Progresso + Voltar à lista geral)
    let inCount = 0;
    scopePeople.forEach(p => {
        if (getCheckinTime(p.id, dayKey)) inCount++;
    });
    const totalCount = scopePeople.length;
    const pendingCount = Math.max(0, totalCount - inCount);
    const pct = totalCount > 0 ? Math.round((inCount / totalCount) * 100) : 0;

    document.getElementById('footer-progress-fill').style.width = `${pct}%`;
    document.getElementById('footer-tally').innerHTML =
        `<strong>${inCount}</strong> / ${totalCount} entraram · ${pendingCount} faltam`;

    const isTeamFiltered = state.selectedBuckets.size < ALL_BUCKET_IDS.length;
    document.getElementById('btn-footer-reset').classList.toggle('hidden', !isTeamFiltered);
    document.getElementById('footer-cue').classList.toggle('hidden', isTeamFiltered);
}

function resetAllFilters() {
    state.day = 'all';
    state.selectedBuckets = new Set(ALL_BUCKET_IDS);
    state.turn = 'all';
    state.arrivalFilter = 'all';
    state.letter = 'ALL';
    state.search = '';
    state.barMode = 'alpha';
    state.expandedInfoId = null;
    document.getElementById('unified-search-input').value = '';
    renderApp();
}

/* ============================================================================
   9. INTERAÇÕES DAS LINHAS (1 CLIQUE DIRETO + SWIPE BIDIRECIONAL)
   ============================================================================ */
function bindRosterEvents() {
    const list = document.getElementById('roster-list');

    // 1 clique direto na linha alterna Stage 0 <-> Stage 1 (Modo Info)
    list.querySelectorAll('[data-toggle-info]').forEach(el => {
        el.addEventListener('click', (e) => {
            if (e.target.closest('[data-desktop-acesso]') || e.target.closest('[data-open-profile]')) return;
            const id = Number(el.dataset.toggleInfo);
            state.expandedInfoId = state.expandedInfoId === id ? null : id;
            renderApp();
        });
    });

    // Botão PERFIL no Modo Info
    list.querySelectorAll('[data-open-profile]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openProfileSheet(Number(btn.dataset.openProfile));
        });
    });

    // Botão LIBERAR / ENTROU no Desktop
    list.querySelectorAll('[data-desktop-acesso]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePersonAccess(Number(btn.dataset.desktopAcesso));
        });
    });

    // Swipe bidirecional (esquerda ou direita) em qualquer estágio
    list.querySelectorAll('[data-shell-id]').forEach(shell => {
        const id = Number(shell.dataset.shellId);
        const surface = shell.querySelector('.row-surface');
        const track = shell.querySelector('.swipe-track');

        let startX = 0;
        let startY = 0;
        let deltaX = 0;
        let isHorizontal = false;
        let active = false;

        const onStart = (x, y) => {
            startX = x;
            startY = y;
            deltaX = 0;
            isHorizontal = false;
            active = true;
            surface.classList.remove('is-nudge');
        };

        const onMove = (x, y, preventFn) => {
            if (!active) return;
            const dx = x - startX;
            const dy = y - startY;

            if (!isHorizontal) {
                if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.25) {
                    isHorizontal = true;
                    surface.classList.add('is-dragging');
                } else if (Math.abs(dy) > 12) {
                    active = false;
                    return;
                }
            }

            if (isHorizontal) {
                if (preventFn) preventFn();
                const clamped = Math.max(-136, Math.min(136, dx * 0.85));
                deltaX = clamped;
                surface.style.transform = `translateX(${clamped}px)`;
                track.style.opacity = Math.min(1, Math.abs(clamped) / 68).toFixed(2);
            }
        };

        const onEnd = () => {
            if (!active) return;
            active = false;
            surface.classList.remove('is-dragging');

            if (isHorizontal) {
                const triggered = Math.abs(deltaX) >= 68;
                surface.style.transform = 'translateX(0)';
                track.style.opacity = '0';

                // Impede clique residual imediatamente após soltar o swipe
                const suppressClick = (ev) => {
                    ev.stopPropagation();
                    ev.preventDefault();
                };
                shell.addEventListener('click', suppressClick, { capture: true, once: true });

                if (triggered) {
                    togglePersonAccess(id);
                }
            }
        };

        surface.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            onStart(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        surface.addEventListener('touchmove', (e) => {
            if (e.touches.length !== 1) return;
            onMove(e.touches[0].clientX, e.touches[0].clientY, () => e.preventDefault());
        }, { passive: false });

        surface.addEventListener('touchend', onEnd);
        surface.addEventListener('touchcancel', onEnd);

        surface.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'touch' || e.button !== 0) return;
            onStart(e.clientX, e.clientY);
        });

        surface.addEventListener('pointermove', (e) => {
            if (e.pointerType === 'touch') return;
            onMove(e.clientX, e.clientY, null);
        });

        surface.addEventListener('pointerup', (e) => {
            if (e.pointerType === 'touch') return;
            onEnd();
        });
    });
}

/* ============================================================================
   10. MODAL UNIFICADO ⚙️ ([ Filtros ] | [ 👁️ Colunas ])
   ============================================================================ */
function renderSettingsModal() {
    document.querySelectorAll('[data-settings-tab]').forEach(btn => {
        btn.setAttribute('aria-selected', btn.dataset.settingsTab === state.settingsTab ? 'true' : 'false');
    });

    const body = document.getElementById('settings-modal-body');

    if (state.settingsTab === 'filters') {
        body.innerHTML = `
            <div class="modal-section">
                <span class="modal-sec-label">Dia da operação</span>
                <select id="set-day-select" class="modal-select">
                    <option value="all" ${state.day === 'all' ? 'selected' : ''}>Todos os dias (Lista completa · 75 pessoas)</option>
                    ${DAYS.map(d => `<option value="${d.key}" ${state.day === d.key ? 'selected' : ''}>${d.label}</option>`).join('')}
                </select>
            </div>

            <div class="modal-section">
                <span class="modal-sec-label">Turno</span>
                <select id="set-turn-select" class="modal-select">
                    <option value="all" ${state.turn === 'all' ? 'selected' : ''}>Todos os turnos</option>
                    ${TURNS.map(t => `<option value="${t}" ${state.turn === t ? 'selected' : ''}>${t}</option>`).join('')}
                </select>
            </div>

            <div class="modal-section">
                <div class="modal-sec-head">
                    <span class="modal-sec-label">Equipes &amp; Marcas incluídas</span>
                    <div style="display:flex;gap:10px;">
                        <button type="button" class="link-action" id="btn-set-teams-all">Marcar todas</button>
                        <button type="button" class="link-action" id="btn-set-teams-none">Desmarcar</button>
                    </div>
                </div>
                <div class="teams-check-grid">
                    ${ALL_BUCKET_IDS.map(bucketId => {
                        const meta = TEAM_BUCKETS[bucketId];
                        const count = PEOPLE.filter(p => p.bucket === bucketId && (state.day === 'all' || p.dias.includes(state.day))).length;
                        const checked = state.selectedBuckets.has(bucketId);
                        return `
                            <label class="team-chk-card" style="--tc:${meta.color}">
                                <span class="team-chk-left">
                                    <input type="checkbox" data-bucket-chk="${bucketId}" ${checked ? 'checked' : ''}>
                                    <span class="team-chk-name">${esc(meta.label)}</span>
                                </span>
                                <span class="team-chk-count">${count}</span>
                            </label>
                        `;
                    }).join('')}
                </div>
            </div>
        `;

        document.getElementById('set-day-select').addEventListener('change', (e) => {
            state.day = e.target.value;
            renderSettingsModal();
            renderApp();
        });

        document.getElementById('set-turn-select').addEventListener('change', (e) => {
            state.turn = e.target.value;
            renderApp();
        });

        document.getElementById('btn-set-teams-all').addEventListener('click', () => {
            state.selectedBuckets = new Set(ALL_BUCKET_IDS);
            renderSettingsModal();
            renderApp();
        });

        document.getElementById('btn-set-teams-none').addEventListener('click', () => {
            state.selectedBuckets.clear();
            renderSettingsModal();
            renderApp();
        });

        body.querySelectorAll('[data-bucket-chk]').forEach(chk => {
            chk.addEventListener('change', (e) => {
                const id = e.target.dataset.bucketChk;
                if (e.target.checked) state.selectedBuckets.add(id);
                else state.selectedBuckets.delete(id);
                renderApp();
            });
        });
    } else {
        // ABA 👁️ COLUNAS (Nível 1: Modo Acesso | Nível 2: Modo Info)
        const tier = state.columnsTier;
        const order = tier === 'acesso' ? state.colsConfig.acessoOrder : state.colsConfig.infoOrder;
        const activeSet = new Set(tier === 'acesso' ? state.colsConfig.acessoActive : state.colsConfig.infoActive);
        const activeOrderList = order.filter(k => activeSet.has(k));

        body.innerHTML = `
            <div class="segmented-tabs" role="tablist">
                <button type="button" class="seg-tab" role="tab" data-col-tier="acesso" aria-selected="${tier === 'acesso'}">
                    Nível 1 · Modo Acesso
                </button>
                <button type="button" class="seg-tab" role="tab" data-col-tier="info" aria-selected="${tier === 'info'}">
                    Nível 2 · Modo Info
                </button>
            </div>

            <div class="modal-sec-head">
                <span class="modal-sec-label">
                    ${tier === 'acesso' ? 'Colunas da listagem principal' : 'Campos exibidos ao tocar no nome'}
                </span>
            </div>

            <div class="col-config-list">
                ${order.map((key, idx) => {
                    const col = COLUMN_CATALOG.find(c => c.key === key);
                    const isChecked = activeSet.has(key);
                    const activePos = isChecked ? activeOrderList.indexOf(key) + 1 : null;
                    return `
                        <div class="col-config-row">
                            <label class="col-config-left">
                                <input type="checkbox" data-col-toggle="${key}" ${isChecked ? 'checked' : ''}>
                                <span class="col-pos-badge">${activePos ? `#${activePos}` : '—'}</span>
                                <span class="col-config-label">${esc(col.label)}</span>
                            </label>
                            <div class="col-order-btns">
                                <button type="button" class="ord-btn" data-col-move="${key}" data-dir="-1" ${idx === 0 ? 'disabled' : ''} aria-label="Mover para cima">↑</button>
                                <button type="button" class="ord-btn" data-col-move="${key}" data-dir="1" ${idx === order.length - 1 ? 'disabled' : ''} aria-label="Mover para baixo">↓</button>
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;

        body.querySelectorAll('[data-col-tier]').forEach(btn => {
            btn.addEventListener('click', () => {
                state.columnsTier = btn.dataset.colTier;
                renderSettingsModal();
            });
        });

        body.querySelectorAll('[data-col-toggle]').forEach(chk => {
            chk.addEventListener('change', (e) => {
                const key = e.target.dataset.colToggle;
                const arrKey = tier === 'acesso' ? 'acessoActive' : 'infoActive';
                const set = new Set(state.colsConfig[arrKey]);

                if (e.target.checked) {
                    set.add(key);
                } else {
                    if (set.size <= 1) {
                        e.target.checked = true;
                        showToast('Mantenha pelo menos 1 coluna ativa');
                        return;
                    }
                    set.delete(key);
                }
                state.colsConfig[arrKey] = [...set];
                saveColsConfig();
                renderSettingsModal();
                renderApp();
            });
        });

        body.querySelectorAll('[data-col-move]').forEach(btn => {
            btn.addEventListener('click', () => {
                const key = btn.dataset.colMove;
                const dir = Number(btn.dataset.dir);
                const ordKey = tier === 'acesso' ? 'acessoOrder' : 'infoOrder';
                const arr = [...state.colsConfig[ordKey]];
                const idx = arr.indexOf(key);
                const targetIdx = idx + dir;
                if (targetIdx < 0 || targetIdx >= arr.length) return;
                [arr[idx], arr[targetIdx]] = [arr[targetIdx], arr[idx]];
                state.colsConfig[ordKey] = arr;
                saveColsConfig();
                renderSettingsModal();
                renderApp();
            });
        });
    }
}

/* ============================================================================
   11. BOTTOM SHEETS (PERFIL COM CTA FIXO + ESTATÍSTICAS POR EQUIPE)
   ============================================================================ */
function closeAllSheets() {
    state.activeSheet = null;
    state.sheetPersonId = null;
    document.body.classList.remove('sheet-open');
    document.getElementById('sheet-backdrop').classList.remove('open');

    const pSheet = document.getElementById('profile-sheet');
    const sSheet = document.getElementById('stats-sheet');
    pSheet.classList.remove('open');
    pSheet.setAttribute('aria-hidden', 'true');
    sSheet.classList.remove('open');
    sSheet.setAttribute('aria-hidden', 'true');
}

function openProfileSheet(personId) {
    closeAllSheets();
    state.activeSheet = 'profile';
    state.sheetPersonId = personId;
    renderProfileSheet();
}

function renderProfileSheet() {
    const sheet = document.getElementById('profile-sheet');
    const backdrop = document.getElementById('sheet-backdrop');
    const p = PEOPLE.find(item => item.id === state.sheetPersonId);

    if (!p) {
        closeAllSheets();
        return;
    }

    const meta = TEAM_BUCKETS[p.bucket] || { color: '#4fb3d9', full: p.bucket };
    const dayKey = getOperationalDayKey();
    const checkedTime = getCheckinTime(p.id, dayKey);
    const revealed = state.revealedDocs.has(p.id);
    const hasDiet = p.alimentacao && p.alimentacao !== 'Sem restrição';

    sheet.innerHTML = `
        <div class="sheet-grabber" aria-hidden="true"></div>
        <div class="sheet-head">
            <span class="mono" style="font-size:0.74rem;font-weight:700;color:var(--text-secondary);">PERFIL · CREDENCIAMENTO</span>
            <button type="button" class="modal-close" id="btn-close-profile" aria-label="Fechar">×</button>
        </div>

        <div class="sheet-body">
            <div class="sheet-hero" style="--tc:${meta.color}">
                <div class="sheet-kicker">${esc(p.bucket)} · ${esc(p.empresa)}</div>
                <h2 class="sheet-name">${esc(p.nome_social)}</h2>
                <div class="sheet-civil">Civil: ${esc(p.nome_completo)} · ${esc(p.pronomes_full)}</div>
            </div>

            <div class="doc-box">
                <div class="doc-pair">
                    <div>
                        <span>CPF</span>
                        <strong>${revealed ? esc(p.cpf) : maskCPF(p.cpf)}</strong>
                    </div>
                    <div>
                        <span>RG</span>
                        <strong>${revealed ? esc(p.rg) : maskRG(p.rg)}</strong>
                    </div>
                </div>
                <button type="button" class="btn" id="btn-toggle-doc" style="height:32px;font-size:0.75rem;">
                    ${revealed ? 'Ocultar' : 'Revelar'}
                </button>
            </div>

            <div class="sheet-grid">
                <div class="kv-item">
                    <div class="kv-label">Função / Papel</div>
                    <div class="kv-val">${esc(p.funcao)}</div>
                </div>
                <div class="kv-item">
                    <div class="kv-label">Instagram</div>
                    <div class="kv-val mono">${esc(p.instagram || '—')}</div>
                </div>
                <div class="kv-item">
                    <div class="kv-label">WhatsApp</div>
                    <div class="kv-val mono">${esc(p.whatsapp || '—')}</div>
                </div>
                <div class="kv-item">
                    <div class="kv-label">E-mail</div>
                    <div class="kv-val">${esc(p.email || '—')}</div>
                </div>
                <div class="kv-item">
                    <div class="kv-label">Turnos</div>
                    <div class="kv-val">${esc(p.turnos.join(' · '))}</div>
                </div>
                <div class="kv-item">
                    <div class="kv-label">Alimentação</div>
                    <div class="kv-val">${hasDiet ? `<span class="diet-badge">${esc(p.alimentacao)}</span>` : 'Sem restrição'}</div>
                </div>
                <div class="kv-item full">
                    <div class="kv-label">Dias credenciados</div>
                    <div class="days-mini-row">
                        ${DAYS.map(d => `
                            <span class="day-chip-mini ${p.dias.includes(d.key) ? 'on' : ''}" style="--tc:${meta.color}">${d.key}</span>
                        `).join('')}
                    </div>
                </div>
                ${p.obs ? `
                    <div class="kv-item full">
                        <div class="kv-label">Observações</div>
                        <div class="kv-val" style="color:var(--text-secondary);">${esc(p.obs)}</div>
                    </div>
                ` : ''}
            </div>
        </div>

        <!-- Botão de ação sempre fixo na base da área do perfil -->
        <div class="sheet-pinned-foot">
            <button type="button" class="sheet-cta-btn ${checkedTime ? 'is-undo' : ''}" id="btn-profile-liberar">
                ${checkedTime
                    ? `↩ DESFAZER ENTRADA (${esc(checkedTime)})`
                    : `✓ LIBERAR ENTRADA AGORA`
                }
            </button>
        </div>
    `;

    document.body.classList.add('sheet-open');
    backdrop.classList.add('open');
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');

    document.getElementById('btn-close-profile').addEventListener('click', closeAllSheets);
    document.getElementById('btn-toggle-doc').addEventListener('click', () => {
        if (state.revealedDocs.has(p.id)) {
            state.revealedDocs.delete(p.id);
        } else {
            state.revealedDocs.add(p.id);
            showToast('CPF/RG revelados · log LGPD registrado');
        }
        renderProfileSheet();
    });
    document.getElementById('btn-profile-liberar').addEventListener('click', () => {
        togglePersonAccess(p.id);
    });
}

function openStatsSheet() {
    closeAllSheets();
    state.activeSheet = 'stats';
    renderStatsSheet();
}

function renderStatsSheet() {
    const sheet = document.getElementById('stats-sheet');
    const backdrop = document.getElementById('sheet-backdrop');
    const body = document.getElementById('stats-sheet-body');
    const dayKey = getOperationalDayKey();

    // Calcula estatísticas sobre o dia e turno atuais para TODAS as equipes
    const rows = ALL_BUCKET_IDS.map(bucketId => {
        const meta = TEAM_BUCKETS[bucketId];
        const members = PEOPLE.filter(p => {
            if (p.bucket !== bucketId) return false;
            if (state.day !== 'all' && !p.dias.includes(state.day)) return false;
            if (state.turn !== 'all' && !p.turnos.includes(state.turn)) return false;
            return true;
        });
        const total = members.length;
        const entered = members.filter(p => Boolean(getCheckinTime(p.id, dayKey))).length;
        const missing = total - entered;
        const pct = total > 0 ? Math.round((entered / total) * 100) : 0;
        const isOnlySelected = state.selectedBuckets.size === 1 && state.selectedBuckets.has(bucketId);

        return { bucketId, meta, total, entered, missing, pct, isOnlySelected };
    }).filter(r => r.total > 0);

    body.innerHTML = `
        <div class="team-stat-list">
            ${rows.map(r => `
                <button type="button" class="team-stat-btn ${r.isOnlySelected ? 'is-active' : ''}" style="--tc:${r.meta.color}" data-pick-bucket="${r.bucketId}">
                    <div class="team-stat-top">
                        <span class="team-stat-name">${esc(r.meta.full)}</span>
                        <span class="team-stat-nums"><strong>${r.entered}</strong> / ${r.total} · ${r.missing} faltam</span>
                    </div>
                    <div class="team-stat-bar">
                        <div class="team-stat-bar-fill" style="width:${r.pct}%;"></div>
                    </div>
                </button>
            `).join('')}
        </div>
    `;

    body.querySelectorAll('[data-pick-bucket]').forEach(btn => {
        btn.addEventListener('click', () => {
            const bucketId = btn.dataset.pickBucket;
            state.selectedBuckets = new Set([bucketId]);
            state.letter = 'ALL';
            state.expandedInfoId = null;
            closeAllSheets();
            renderApp();
        });
    });

    document.body.classList.add('sheet-open');
    backdrop.classList.add('open');
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
}

/* ============================================================================
   12. BINDING GLOBAL E INICIALIZAÇÃO
   ============================================================================ */
function bindGlobalEvents() {
    // 1) Botão 3-estados de chegada (◑ TODOS -> ○ FALTAM -> ● ENTRARAM)
    document.getElementById('btn-arrival-cycle').addEventListener('click', () => {
        const order = ['all', 'pending', 'in'];
        const nextIdx = (order.indexOf(state.arrivalFilter) + 1) % order.length;
        state.arrivalFilter = order[nextIdx];
        state.expandedInfoId = null;
        renderApp();
    });

    // 2) Barra Unificada: alternar entre Modo Alfabeto e Modo Busca
    const searchInput = document.getElementById('unified-search-input');

    document.getElementById('btn-enter-search').addEventListener('click', () => {
        state.barMode = 'search';
        renderUnifiedBarMode();
        requestAnimationFrame(() => searchInput.focus());
    });

    document.getElementById('btn-exit-search').addEventListener('click', () => {
        state.barMode = 'alpha';
        renderUnifiedBarMode();
    });

    searchInput.addEventListener('input', (e) => {
        state.search = e.target.value;
        state.expandedInfoId = null;
        renderApp();
    });

    document.getElementById('btn-clear-search').addEventListener('click', () => {
        state.search = '';
        searchInput.value = '';
        renderApp();
        searchInput.focus();
    });

    // 3) Modal Unificado ⚙️ (Filtros + 👁️ Colunas)
    const settingsModal = document.getElementById('settings-modal');

    document.getElementById('btn-open-settings').addEventListener('click', () => {
        renderSettingsModal();
        if (settingsModal.showModal) settingsModal.showModal();
    });

    document.getElementById('btn-close-settings').addEventListener('click', () => settingsModal.close());
    document.getElementById('btn-settings-done').addEventListener('click', () => settingsModal.close());
    settingsModal.addEventListener('click', (e) => {
        if (e.target === settingsModal) settingsModal.close();
    });

    document.querySelectorAll('[data-settings-tab]').forEach(tab => {
        tab.addEventListener('click', () => {
            state.settingsTab = tab.dataset.settingsTab;
            renderSettingsModal();
        });
    });

    document.getElementById('btn-settings-reset').addEventListener('click', () => {
        if (state.settingsTab === 'filters') {
            state.day = 'all';
            state.selectedBuckets = new Set(ALL_BUCKET_IDS);
            state.turn = 'all';
            state.letter = 'ALL';
        } else {
            state.colsConfig = getDefaultColsConfig();
            saveColsConfig();
        }
        renderSettingsModal();
        renderApp();
    });

    // 4) Rodapé + Bottom Sheet de Estatísticas por Equipe
    document.getElementById('btn-open-stats').addEventListener('click', openStatsSheet);
    document.getElementById('btn-close-stats').addEventListener('click', closeAllSheets);
    document.getElementById('btn-stats-all-teams').addEventListener('click', () => {
        state.selectedBuckets = new Set(ALL_BUCKET_IDS);
        state.letter = 'ALL';
        closeAllSheets();
        renderApp();
    });

    document.getElementById('btn-footer-reset').addEventListener('click', () => {
        state.selectedBuckets = new Set(ALL_BUCKET_IDS);
        state.letter = 'ALL';
        renderApp();
    });

    // 5) Backdrop & ESC para fechar Bottom Sheets
    document.getElementById('sheet-backdrop').addEventListener('click', closeAllSheets);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.activeSheet) closeAllSheets();
    });

    // 6) Toast Desfazer
    document.getElementById('toast-undo-btn').addEventListener('click', () => {
        if (!state.lastUndo) return;
        const { personId, dayKey, restoreTime } = state.lastUndo;
        setCheckinTime(personId, restoreTime, dayKey);
        state.lastUndo = null;
        document.getElementById('toast-bar').classList.remove('visible');
        renderApp();
        if (state.activeSheet === 'profile' && state.sheetPersonId === personId) renderProfileSheet();
        if (state.activeSheet === 'stats') renderStatsSheet();
    });
}

bindGlobalEvents();
renderApp();
