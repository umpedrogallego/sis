<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c1114">
    <title>Portaria · Check-in — Casa de Criadores 58</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =====================================================================
           1. DESIGN TOKENS — MONOCROMIA GRAFITE-PETRÓLEO + COR FUNCIONAL
           ===================================================================== */
        :root {
            --bg-base: #0c1114;
            --bg-surface: #12181c;
            --bg-elevated: #171f24;
            --bg-hover: #1b242a;
            --bg-input: #090d10;

            --border: rgba(255, 255, 255, 0.09);
            --border-strong: rgba(255, 255, 255, 0.22);

            --text-primary: #eef2f4;
            --text-secondary: #8b98a1;
            --text-muted: #5a6872;

            /* Cores das 4 equipes principais + marcas */
            --team-maxima: #e85d9e;
            --team-lema: #e5a93c;
            --team-staff: #4fb3d9;
            --team-estagio: #4ec28c;

            /* Estados operacionais de portaria */
            --status-in: #4ec28c;
            --status-in-bg: rgba(78, 194, 140, 0.14);
            --status-in-border: rgba(78, 194, 140, 0.44);
            --btn-liberar-bg: #1b5e3a;
            --btn-liberar-hover: #237649;
            --btn-liberar-border: #38a169;
            --alert-warn: #f0b429;
            --alert-warn-bg: rgba(240, 180, 41, 0.14);
            --alert-diet: #d6c5a3;
            --alert-diet-bg: rgba(214, 197, 163, 0.11);

            /* Alturas exatas da pilha sticky */
            --h-header: 52px;
            --h-unified: 54px;
            --h-thead: 32px;
            --h-footer: 48px;

            --radius: 4px;
            --font-sans: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Sem overflow-x: hidden em html/body para preservar position: sticky no iOS Safari / Android Chrome */
        html {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.35;
            -webkit-font-smoothing: antialiased;
            color-scheme: dark;
        }

        body {
            min-height: 100dvh;
            background: var(--bg-base);
            color: var(--text-primary);
        }

        body.sheet-open {
            overflow: hidden;
            touch-action: none;
        }

        button, input, select {
            font-family: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--text-primary);
            outline-offset: 2px;
        }

        .mono {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        .tabular {
            font-variant-numeric: tabular-nums;
        }

        /* =====================================================================
           2. CABEÇALHO LIMPO E FIXO (52px, top: 0)
              [ Logo CdC ] [ ◑ TODOS / ○ FALTAM / ● ENTRARAM ]   (vazio)   [ ⚙️ ]
           ===================================================================== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 60;
            height: var(--h-header);
            width: 100%;
            background: rgba(12, 17, 20, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .app-header-inner {
            max-width: 1080px;
            height: 100%;
            margin: 0 auto;
            padding: 0 8px 0 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .brand-logo-wrap {
            display: inline-flex;
            align-items: center;
            height: 32px;
            flex-shrink: 0;
        }

        .brand-logo {
            height: 24px;
            width: auto;
            max-width: 110px;
            object-fit: contain;
            display: block;
        }

        .brand-logo-fallback {
            display: none;
            font-family: var(--font-mono);
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            white-space: nowrap;
        }

        /* Botão 3-estados: ◑ TODOS -> ○ FALTAM -> ● ENTRARAM */
        .arrival-cycle-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            padding: 0 10px;
            border-radius: var(--radius);
            border: 1px solid var(--border-strong);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.12s, border-color 0.12s, color 0.12s;
        }

        .arrival-cycle-btn:hover {
            background: var(--bg-elevated);
        }

        .arrival-cycle-btn.is-pending {
            border-color: rgba(240, 180, 41, 0.5);
            background: var(--alert-warn-bg);
            color: var(--alert-warn);
        }

        .arrival-cycle-btn.is-in {
            border-color: var(--status-in-border);
            background: var(--status-in-bg);
            color: var(--status-in);
        }

        .arrival-glyph {
            font-size: 0.92rem;
            line-height: 1;
        }

        /* Centro intencionalmente vazio para manter o cabeçalho descongestionado */
        .header-spacer {
            flex: 1;
            min-width: 8px;
        }

        /* Botão único ⚙️ (44x44px hit target) */
        .gear-btn {
            position: relative;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.12s;
        }

        .gear-btn:hover {
            background: var(--bg-elevated);
        }

        .indicator-dot {
            position: absolute;
            top: 9px;
            right: 9px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--alert-warn);
            box-shadow: 0 0 0 2px var(--bg-base);
            pointer-events: none;
        }

        /* =====================================================================
           3. BARRA UNIFICADA DE BUSCA + ALFABETO (54px, sticky top: 52px)
           ===================================================================== */
        .unified-bar {
            position: sticky;
            top: var(--h-header);
            z-index: 50;
            height: var(--h-unified);
            width: 100%;
            background: var(--bg-input);
            border-bottom: 1px solid var(--border-strong);
        }

        .unified-bar-inner {
            max-width: 1080px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: stretch;
        }

        /* Botões fixos de 48px nas extremidades (Lupa ou sort_by_alpha) */
        .unified-mode-btn {
            position: relative;
            width: 48px;
            height: 100%;
            flex-shrink: 0;
            border: none;
            background: var(--bg-surface);
            color: var(--text-primary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.12s, color 0.12s;
        }

        .unified-mode-btn:hover {
            background: var(--bg-elevated);
        }

        .unified-mode-btn.is-left {
            border-right: 1px solid var(--border-strong);
        }

        .unified-mode-btn.is-right {
            border-left: 1px solid var(--border-strong);
        }

        .unified-mode-btn .indicator-dot {
            top: 11px;
            right: 11px;
        }

        /* MODO ALFABETO: Scroll horizontal strictly à direita da lupa com fade suave */
        .alpha-scroll-viewport {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x proximity;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            padding: 0 14px 0 8px;
            gap: 4px;
            /* Soft-edge mask-image fade (Modern Web Guidance) */
            -webkit-mask-image: linear-gradient(to right, black 0, black calc(100% - 22px), transparent 100%);
            mask-image: linear-gradient(to right, black 0, black calc(100% - 22px), transparent 100%);
        }

        .alpha-scroll-viewport::-webkit-scrollbar {
            display: none;
        }

        .alpha-chip {
            scroll-snap-align: start;
            min-width: 38px;
            height: 38px;
            padding: 0 8px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.12s, color 0.12s, border-color 0.12s;
        }

        .alpha-chip:hover {
            color: var(--text-primary);
            background: var(--bg-surface);
        }

        .alpha-chip.active {
            background: var(--text-primary);
            color: var(--bg-base);
            border-color: var(--text-primary);
            font-weight: 700;
        }

        /* MODO BUSCA: Campo full-width (16px para evitar zoom automático no iOS Safari) */
        .search-mode-field {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 8px 0 12px;
            gap: 8px;
        }

        .search-mode-icon {
            color: var(--text-muted);
            display: inline-flex;
            flex-shrink: 0;
        }

        .unified-search-input {
            flex: 1;
            min-width: 0;
            height: 100%;
            border: none;
            background: transparent;
            font-size: 16px;
            color: var(--text-primary);
        }

        .unified-search-input::placeholder {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .unified-search-input:focus {
            outline: none;
        }

        /* Remove o X nativo feio do webkit para usar o nosso botão tátil */
        .unified-search-input::-webkit-search-cancel-button {
            -webkit-appearance: none;
            appearance: none;
        }

        .search-clear-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 1.15rem;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .search-clear-btn.visible {
            display: inline-flex;
        }

        .search-clear-btn:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .hidden {
            display: none !important;
        }

        /* =====================================================================
           4. CABEÇALHO DE COLUNAS FIXO (sticky top: 106px) & CONTAINER PRINCIPAL
           ===================================================================== */
        .main-shell {
            max-width: 1080px;
            margin: 0 auto;
            width: 100%;
            /* overflow-x: clip não quebra position: sticky em Safari/Chrome */
            overflow-x: clip;
            padding-bottom: calc(var(--h-footer) + env(safe-area-inset-bottom, 0px) + 28px);
        }

        .table-head {
            position: sticky;
            top: calc(var(--h-header) + var(--h-unified));
            z-index: 30;
            display: grid;
            grid-template-columns: var(--cols-mobile, minmax(0, 1.55fr) 54px minmax(0, 1fr));
            align-items: center;
            gap: 8px;
            height: var(--h-thead);
            padding: 0 12px 0 14px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-strong);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .th-cell {
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .th-cell.is-center {
            text-align: center;
        }

        .th-cell.is-desktop-acesso {
            display: none;
        }

        /* =====================================================================
           5. LINHAS DA LISTA — 2 ESTÁGIOS DIRETOS + SWIPE BIDIRECIONAL
              Otimizado para 1000+ registros com content-visibility: auto
           ===================================================================== */
        .row-shell {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            border-left: 3px solid var(--tc);
            background: var(--bg-base);
            content-visibility: auto;
            contain-intrinsic-size: auto 56px;
            transition: opacity 0.2s ease, max-height 0.24s ease, border-bottom-width 0.2s ease;
            max-height: 160px;
        }

        .row-shell.is-exiting {
            opacity: 0;
            max-height: 0;
            border-bottom-width: 0;
            pointer-events: none;
        }

        /* Trilho de fundo revelado no swipe esquerda ou direita */
        .swipe-track {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--btn-liberar-bg);
            color: #ffffff;
            font-family: var(--font-mono);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s linear;
        }

        .swipe-track.is-undo {
            background: #4e3911;
            color: var(--alert-warn);
        }

        /* Superfície deslizável da linha */
        .row-surface {
            position: relative;
            z-index: 2;
            width: 100%;
            min-height: 54px;
            background: var(--bg-base);
            touch-action: pan-y;
            user-select: none;
            transition: transform 0.2s cubic-bezier(0.2, 0.85, 0.25, 1), background-color 0.12s;
        }

        .row-surface.is-dragging {
            transition: none;
        }

        .row-surface:hover {
            background: var(--bg-surface);
        }

        .row-surface.is-checked-in {
            background: #0e1915;
        }

        .row-surface.is-checked-in:hover {
            background: #12211b;
        }

        /* Micro-chevrons discretos nas bordas (zero impacto na largura útil) */
        .swipe-cue {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            opacity: 0.34;
            pointer-events: none;
            line-height: 1;
        }

        .swipe-cue.is-left { left: 3px; }
        .swipe-cue.is-right { right: 3px; }

        @keyframes swipeNudge {
            0%, 100% { transform: translateX(0); }
            28% { transform: translateX(18px); }
            62% { transform: translateX(-14px); }
            85% { transform: translateX(0); }
        }

        .row-surface.is-nudge {
            animation: swipeNudge 1.1s cubic-bezier(0.25, 0.9, 0.3, 1) 0.45s 1;
        }

        /* ESTÁGIO 0 (Padrão): Grid compacto sem sobreposição + chip de horário à direita */
        .stage-0 {
            display: flex;
            align-items: center;
            min-height: 54px;
            padding: 8px 12px 8px 14px;
            gap: 8px;
            cursor: pointer;
        }

        .stage-0-cols {
            flex: 1;
            min-width: 0;
            display: grid;
            grid-template-columns: var(--cols-mobile, minmax(0, 1.55fr) 54px minmax(0, 1fr));
            align-items: center;
            gap: 8px;
        }

        .cell-val {
            min-width: 0;
            font-size: 0.86rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cell-val.is-name {
            font-weight: 600;
            font-size: 0.91rem;
        }

        .cell-val.is-pronoun {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .cell-val.is-team {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.01em;
        }

        .cell-val.is-mono {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        /* Chip de horário SEMPRE à direita no mobile/tablet, nunca colado no nome */
        .mobile-time-chip {
            margin-left: auto;
            flex-shrink: 0;
            padding: 3px 6px;
            border-radius: 3px;
            background: var(--status-in-bg);
            border: 1px solid var(--status-in-border);
            color: var(--status-in);
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 0.67rem;
            font-weight: 700;
            line-height: 1.15;
            white-space: nowrap;
        }

        .desktop-acesso-cell {
            display: none;
        }

        /* ESTÁGIO 1 (1 clique direto no nome -> Modo Info: RG, CPF + botão PERFIL) */
        .stage-1-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 60px;
            padding: 8px 12px 8px 14px;
            background: var(--bg-elevated);
            cursor: pointer;
        }

        .info-left {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-context-row {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .info-context-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-context-team {
            font-family: var(--font-mono);
            font-size: 0.66rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
        }

        .info-fields-strip {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .info-field {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
        }

        .info-field-k {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .info-field-v {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .info-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .perfil-btn {
            height: 38px;
            padding: 0 13px;
            border-radius: var(--radius);
            border: 1px solid var(--border-strong);
            background: var(--text-primary);
            color: var(--bg-base);
            font-family: var(--font-mono);
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            flex-shrink: 0;
        }

        .perfil-btn:hover {
            background: #dce4e8;
        }

        /* =====================================================================
           6. ADAPTAÇÃO DESKTOP (>= 900px e hover): BOTÃO ACESSO + SEM CHIP EXTRA
           ===================================================================== */
        @media (min-width: 900px) and (hover: hover) {
            .table-head {
                grid-template-columns: var(--cols-desktop, minmax(220px, 1.55fr) 74px minmax(160px, 1fr) 124px);
            }

            .th-cell.is-desktop-acesso {
                display: block;
                text-align: center;
            }

            .stage-0 {
                padding: 8px 12px 8px 14px;
            }

            .stage-0-cols {
                grid-template-columns: var(--cols-desktop, minmax(220px, 1.55fr) 74px minmax(160px, 1fr) 124px);
            }

            .mobile-time-chip {
                display: none !important;
            }

            .swipe-cue {
                display: none;
            }

            .desktop-acesso-cell {
                display: flex;
                justify-content: flex-end;
                align-items: center;
            }

            .acesso-btn {
                width: 114px;
                height: 36px;
                padding: 0 8px;
                border-radius: 3px;
                font-family: var(--font-mono);
                font-variant-numeric: tabular-nums;
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.03em;
                cursor: pointer;
                display: inline-flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                line-height: 1.15;
                transition: background 0.12s, border-color 0.12s;
            }

            .acesso-btn.is-liberar {
                background: var(--btn-liberar-bg);
                border: 1px solid var(--btn-liberar-border);
                color: #ffffff;
            }

            .acesso-btn.is-liberar:hover {
                background: var(--btn-liberar-hover);
            }

            .acesso-btn.is-entrou {
                background: var(--status-in-bg);
                border: 1px solid var(--status-in-border);
                color: var(--status-in);
            }

            .acesso-btn.is-entrou:hover {
                background: rgba(78, 194, 140, 0.22);
            }

            .acesso-btn-sub {
                font-size: 0.62rem;
                font-weight: 500;
                opacity: 0.92;
            }
        }

        .empty-state {
            padding: 48px 16px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.88rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 36px;
            padding: 0 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border-strong);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--bg-elevated);
        }

        .btn-primary {
            background: var(--text-primary);
            color: var(--bg-base);
            border-color: var(--text-primary);
            font-weight: 700;
        }

        .btn-primary:hover {
            background: #dce4e8;
        }

        /* =====================================================================
           7. RODAPÉ DISCRETO E PERSISTENTE (CONTAGEM GERAL + ▲ EQUIPES)
           ===================================================================== */
        .footer-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 55;
            background: rgba(12, 17, 20, 0.97);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-strong);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .footer-progress-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.08);
        }

        .footer-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--status-in);
            transition: width 0.25s ease;
        }

        .footer-inner {
            max-width: 1080px;
            min-height: var(--h-footer);
            margin: 0 auto;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .footer-stats-trigger {
            flex: 1;
            min-width: 0;
            height: var(--h-footer);
            border: none;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
        }

        .footer-tally {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 0.78rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .footer-tally strong {
            color: var(--status-in);
            font-weight: 700;
        }

        .footer-cue {
            font-family: var(--font-mono);
            font-size: 0.71rem;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .footer-reset-btn {
            height: 30px;
            padding: 0 10px;
            border-radius: var(--radius);
            border: 1px solid rgba(240, 180, 41, 0.5);
            background: var(--alert-warn-bg);
            color: var(--alert-warn);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* =====================================================================
           8. MODAL UNIFICADO DE CONFIGURAÇÕES ⚙️ ([ Filtros ] | [ 👁️ Colunas ])
           ===================================================================== */
        dialog.settings-modal {
            margin: auto;
            width: min(500px, calc(100vw - 20px));
            max-height: 86dvh;
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            padding: 0;
            overflow: hidden;
        }

        dialog.settings-modal[open] {
            display: flex;
            flex-direction: column;
        }

        dialog.settings-modal::backdrop {
            background: rgba(5, 8, 10, 0.78);
            backdrop-filter: blur(3px);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .modal-title {
            font-size: 0.92rem;
            font-weight: 700;
        }

        .modal-close {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-secondary);
            font-size: 1.25rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .modal-tabs-bar {
            padding: 10px 14px 0;
            flex-shrink: 0;
        }

        .segmented-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            background: var(--bg-input);
            padding: 3px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .seg-tab {
            height: 34px;
            border: none;
            border-radius: 3px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .seg-tab[aria-selected="true"] {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 14px;
            overflow-y: auto;
            overscroll-behavior: contain;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .modal-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-sec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .modal-sec-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .link-action {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .modal-select {
            width: 100%;
            height: 40px;
            padding: 0 10px;
            border-radius: var(--radius);
            border: 1px solid var(--border-strong);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 16px;
        }

        .teams-check-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        @media (max-width: 460px) {
            .teams-check-grid {
                grid-template-columns: 1fr;
            }
        }

        .team-chk-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 9px 10px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            border-left: 3px solid var(--tc);
            background: var(--bg-elevated);
            cursor: pointer;
            font-size: 0.8rem;
        }

        .team-chk-card input {
            accent-color: var(--text-primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .team-chk-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .team-chk-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .team-chk-count {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* Sub-tabs e lista de colunas dentro da aba 👁️ Colunas */
        .col-config-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .col-config-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-elevated);
        }

        .col-config-left {
            display: flex;
            align-items: center;
            gap: 9px;
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .col-config-left input {
            width: 16px;
            height: 16px;
            accent-color: var(--text-primary);
            cursor: pointer;
        }

        .col-pos-badge {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
            background: var(--bg-input);
            border: 1px solid var(--border-strong);
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .col-config-label {
            font-size: 0.83rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-order-btns {
            display: inline-flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .ord-btn {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--bg-surface);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            cursor: pointer;
        }

        .ord-btn:disabled {
            opacity: 0.28;
            cursor: not-allowed;
        }

        .modal-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            background: var(--bg-base);
            flex-shrink: 0;
        }

        /* =====================================================================
           9. BOTTOM SHEETS (PERFIL + ESTATÍSTICAS POR EQUIPE)
              Rolável na metade inferior (~62dvh) com botão de ação fixo na base
           ===================================================================== */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            z-index: 80;
            background: rgba(5, 8, 10, 0.74);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.16s ease;
        }

        .sheet-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 90;
            max-width: 680px;
            margin: 0 auto;
            height: 62dvh;
            max-height: 85dvh;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-strong);
            border-radius: 12px 12px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateY(105%);
            transition: transform 0.22s cubic-bezier(0.2, 0.85, 0.25, 1);
        }

        .bottom-sheet.open {
            transform: translateY(0);
        }

        @media (min-width: 900px) {
            .bottom-sheet {
                top: 0;
                left: auto;
                right: 0;
                bottom: 0;
                width: 440px;
                height: 100dvh;
                max-height: 100dvh;
                border-radius: 0;
                border-top: none;
                border-left: 1px solid var(--border-strong);
                transform: translateX(105%);
            }

            .bottom-sheet.open {
                transform: translateX(0);
            }
        }

        .sheet-grabber {
            width: 36px;
            height: 4px;
            border-radius: 99px;
            background: var(--border-strong);
            margin: 8px auto 0;
            flex-shrink: 0;
        }

        @media (min-width: 900px) {
            .sheet-grabber {
                display: none;
            }
        }

        .sheet-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 14px 10px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sheet-body {
            flex: 1;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: 14px 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .sheet-pinned-foot {
            flex-shrink: 0;
            padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid var(--border-strong);
            background: var(--bg-base);
        }

        .sheet-hero {
            border-left: 3px solid var(--tc);
            padding-left: 12px;
        }

        .sheet-kicker {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .sheet-name {
            font-size: 1.28rem;
            font-weight: 700;
            line-height: 1.15;
            margin-top: 2px;
        }

        .sheet-civil {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .doc-box {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .doc-pair {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .doc-pair span {
            display: block;
            font-size: 0.66rem;
            color: var(--text-muted);
        }

        .doc-pair strong {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 0.86rem;
            font-weight: 600;
        }

        .sheet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .kv-item.full {
            grid-column: 1 / -1;
        }

        .kv-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .kv-val {
            font-size: 0.84rem;
            color: var(--text-primary);
            word-break: break-word;
        }

        .days-mini-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .day-chip-mini {
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .day-chip-mini.on {
            border-color: var(--tc);
            color: var(--text-primary);
            background: var(--bg-elevated);
            font-weight: 600;
        }

        .diet-badge {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 3px;
            background: var(--alert-diet-bg);
            color: var(--alert-diet);
            font-size: 0.75rem;
        }

        .sheet-cta-btn {
            width: 100%;
            height: 46px;
            border-radius: var(--radius);
            border: 1px solid var(--btn-liberar-border);
            background: var(--btn-liberar-bg);
            color: #ffffff;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            cursor: pointer;
        }

        .sheet-cta-btn:hover {
            background: var(--btn-liberar-hover);
        }

        .sheet-cta-btn.is-undo {
            background: var(--bg-elevated);
            color: var(--alert-warn);
            border-color: rgba(240, 180, 41, 0.48);
        }

        /* Linhas de estatísticas por equipe no Stats Sheet */
        .team-stat-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .team-stat-btn {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            border-left: 3px solid var(--tc);
            background: var(--bg-elevated);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: border-color 0.12s, background 0.12s;
        }

        .team-stat-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-strong);
            border-left-color: var(--tc);
        }

        .team-stat-btn.is-active {
            border-color: var(--tc);
            background: var(--bg-hover);
        }

        .team-stat-top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .team-stat-name {
            font-size: 0.86rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .team-stat-nums {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 0.74rem;
            color: var(--text-secondary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .team-stat-nums strong {
            color: var(--status-in);
        }

        .team-stat-bar {
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .team-stat-bar-fill {
            height: 100%;
            background: var(--tc);
        }

        /* =====================================================================
           10. TOAST COM DESFAZER (POSICIONADO ACIMA DO RODAPÉ FIXO)
           ===================================================================== */
        .toast-bar {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: calc(var(--h-footer) + env(safe-area-inset-bottom, 0px) + 10px);
            z-index: 120;
            max-width: 520px;
            margin: 0 auto;
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.8rem;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
            transform: translateY(150%);
            opacity: 0;
            transition: transform 0.16s ease, opacity 0.16s ease;
            pointer-events: none;
        }

        .toast-bar.visible {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .toast-undo-btn {
            height: 28px;
            padding: 0 10px;
            border-radius: 3px;
            border: 1px solid var(--border-strong);
            background: var(--bg-surface);
            color: var(--alert-warn);
            font-family: var(--font-mono);
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- =======================================================================
         1. CABEÇALHO LIMPO E FIXO (52px, top: 0)
         ======================================================================= -->
    <header class="app-header">
        <div class="app-header-inner">
            <div class="header-left">
                <div class="brand-logo-wrap">
                    <img
                        src="https://casadecriadores.com.br/wp-content/uploads/2024/07/logo_site.png"
                        alt="Casa de Criadores"
                        class="brand-logo"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"
                    >
                    <span class="brand-logo-fallback">CdC 58</span>
                </div>

                <!-- 3 estados: ◑ TODOS -> ○ FALTAM -> ● ENTRARAM -->
                <button type="button" class="arrival-cycle-btn" id="btn-arrival-cycle" title="Alternar filtro de chegada (Todos / Faltam / Entraram)">
                    <span class="arrival-glyph" id="arrival-glyph" aria-hidden="true">◑</span>
                    <span id="arrival-label">TODOS</span>
                </button>
            </div>

            <!-- Espaço central intencionalmente livre -->
            <div class="header-spacer" aria-hidden="true"></div>

            <!-- Botão único de Configurações ⚙️ (Filtros + 👁️ Colunas) -->
            <button type="button" class="gear-btn" id="btn-open-settings" title="Configurações e Colunas" aria-label="Configurações e Colunas">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span class="indicator-dot hidden" id="gear-filter-dot"></span>
            </button>
        </div>
    </header>

    <!-- =======================================================================
         2. BARRA UNIFICADA DE BUSCA + ALFABETO (54px, sticky top: 52px)
         ======================================================================= -->
    <section class="unified-bar" aria-label="Busca e índice alfabético">
        <div class="unified-bar-inner">
            <!-- ESTADO A (Padrão): Lupa fixa à esquerda + scroll de letras à direita -->
            <button type="button" class="unified-mode-btn is-left" id="btn-enter-search" title="Buscar por nome, CPF, RG ou marca" aria-label="Ativar busca textual">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span class="indicator-dot hidden" id="search-active-dot"></span>
            </button>

            <div class="alpha-scroll-viewport" id="alpha-strip" role="group" aria-label="Filtrar por inicial"></div>

            <!-- ESTADO B (Modo Busca): Campo de texto full-width + sort_by_alpha fixo à direita -->
            <div class="search-mode-field hidden" id="search-mode-field">
                <span class="search-mode-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input
                    type="search"
                    id="unified-search-input"
                    class="unified-search-input"

/* ============================================================================
   5. UTILITÁRIOS DE TEXTO, HORÁRIO, MÁSCARAS E COLUNAS
   ============================================================================ */
function esc(str) {
    return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function norm(str) {
    return String(str || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
}

function digitsOnly(str) {
    return String(str || '').replace(/\D/g, '');
}

function getInitialLetter(name) {
    const clean = norm(name).trim();
    if (!clean) return '#';
    const first = clean[0].toUpperCase();
    return (first >= 'A' && first <= 'Z') ? first : '#';
}

function nowHHMM() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function getOperationalDayKey() {
    return state.day === 'all' ? '27/11' : state.day;
}

function getCheckinTime(personId, dayKey = getOperationalDayKey()) {
    return state.checkins[dayKey]?.[personId] || null;
}

function setCheckinTime(personId, timeStr, dayKey = getOperationalDayKey()) {
    if (!state.checkins[dayKey]) state.checkins[dayKey] = {};
    if (timeStr) {
        state.checkins[dayKey][personId] = timeStr;
    } else {
        delete state.checkins[dayKey][personId];
    }
    saveCheckins();
}

function maskCPF(cpf) {
    const p = String(cpf || '').split('.');
    return p.length === 3 ? `***.${p[1]}.${p[2].split('-')[0]}-**` : '***.***.***-**';
}

function maskRG(rg) {
    const p = String(rg || '').split('.');
    return p.length === 3 ? `**.${p[1]}.${p[2].split('-')[0]}-*` : '**.***.***-*';
}

function getOrderedActiveCols(tier) {
    const order = tier === 'acesso' ? state.colsConfig.acessoOrder : state.colsConfig.infoOrder;
    const activeSet = new Set(tier === 'acesso' ? state.colsConfig.acessoActive : state.colsConfig.infoActive);
    return order
        .filter(key => activeSet.has(key))
        .map(key => COLUMN_CATALOG.find(c => c.key === key))
        .filter(Boolean);
}

function getFieldText(p, key) {
    switch (key) {
        case 'nome_social': return p.nome_social;
        case 'pronome': return p.pronome;
        case 'equipe': return p.bucket;
        case 'rg': return p.rg;
        case 'cpf': return p.cpf;
        case 'nome_completo': return p.nome_completo;
        case 'funcao': return p.funcao;
        case 'instagram': return p.instagram || '—';
        case 'turnos': return p.turnos.join(' · ');
        default: return '—';
    }
}

/* ============================================================================
   6. FILTRAGEM PROGRESSIVA (SCOPE -> ARRIVAL + SEARCH -> LETTER)
   ============================================================================ */
// Scope base (Dia, Equipes/Marcas, Turno) — usado pelo rodapé e estatísticas
function getScopePeople() {
    return PEOPLE.filter(p => {
        if (state.day !== 'all' && !p.dias.includes(state.day)) return false;
        if (!state.selectedBuckets.has(p.bucket)) return false;
        if (state.turn !== 'all' && !p.turnos.includes(state.turn)) return false;
        return true;
    }).sort((a, b) => a.nome_social.localeCompare(b.nome_social, 'pt-BR'));
}

// Filtra pelo estado de chegada (◑/○/●) e busca textual (sem aplicar letra ainda)
function getPreLetterPeople(scopePeople) {
    const rawQuery = state.search.trim();
    const qText = norm(rawQuery);
    const qDigits = digitsOnly(rawQuery);
    const dayKey = getOperationalDayKey();

    return scopePeople.filter(p => {
        const checked = Boolean(getCheckinTime(p.id, dayKey));
        if (state.arrivalFilter === 'pending' && checked) return false;
        if (state.arrivalFilter === 'in' && !checked) return false;

        if (qText || qDigits) {
            const hay = norm([
                p.nome_social,
                p.nome_completo,
                p.bucket,
                p.empresa,
                p.funcao,
                p.instagram
            ].join(' '));
            const matchText = qText ? hay.includes(qText) : false;
            const docHay = `${digitsOnly(p.cpf)} ${digitsOnly(p.rg)}`;
            const matchDigits = qDigits.length >= 2 ? docHay.includes(qDigits) : false;
            if (!matchText && !matchDigits) return false;
        }
        return true;
    });
}

function getVisiblePeople(preLetterPeople) {
    if (state.letter === 'ALL') return preLetterPeople;
    return preLetterPeople.filter(p => getInitialLetter(p.nome_social) === state.letter);
}

/* ============================================================================
   7. TOGGLE DE ENTRADA + ANIMAÇÃO SUAVE NO MODO ○ FALTAM + TOAST DESFAZER
   ============================================================================ */
function togglePersonAccess(personId) {
    const person = PEOPLE.find(p => p.id === personId);
    if (!person) return;

    const dayKey = getOperationalDayKey();
    const prevTime = getCheckinTime(personId, dayKey);

    if (navigator.vibrate) {
        try { navigator.vibrate(18); } catch (e) {}
    }

    const willCheckIn = !prevTime;
    const newTime = willCheckIn ? nowHHMM() : null;

    if (willCheckIn) {
        setCheckinTime(personId, newTime, dayKey);
        showToast(`✓ LIBERADO: ${person.nome_social} (${newTime})`, {
            personId,
            dayKey,
            restoreTime: null
        });
    } else {
        setCheckinTime(personId, null, dayKey);
        showToast(`Entrada desfeita: ${person.nome_social}`, {
            personId,
            dayKey,
            restoreTime: prevTime
        });
    }

    // Se estamos em ○ FALTAM e a pessoa acabou de entrar, ou em ● ENTRARAM e foi desfeita: anima saída suave
    const shouldAnimateOut =
        (state.arrivalFilter === 'pending' && willCheckIn) ||
        (state.arrivalFilter === 'in' && !willCheckIn);

    if (shouldAnimateOut) {
        const shellEl = document.querySelector(`[data-shell-id="${personId}"]`);
        if (shellEl) {
            shellEl.classList.add('is-exiting');
            if (state.expandedInfoId === personId) state.expandedInfoId = null;
            setTimeout(() => {
                renderApp();
                if (state.activeSheet === 'profile' && state.sheetPersonId === personId) renderProfileSheet();
                if (state.activeSheet === 'stats') renderStatsSheet();
            }, 220);
            return;
        }
    }

    renderApp();
    if (state.activeSheet === 'profile' && state.sheetPersonId === personId) renderProfileSheet();
    if (state.activeSheet === 'stats') renderStatsSheet();
}

function showToast(msg, undoPayload) {
    const bar = document.getElementById('toast-bar');
    document.getElementById('toast-msg').textContent = msg;
    const undoBtn = document.getElementById('toast-undo-btn');

    state.lastUndo = undoPayload || null;
    undoBtn.style.display = undoPayload ? '' : 'none';
    bar.classList.add('visible');

    if (state.toastTimer) clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => {
        bar.classList.remove('visible');
        state.lastUndo = null;
    }, 4000);
}

/* ============================================================================
   8. RENDERIZAÇÃO PRINCIPAL (HEADER, BARRA UNIFICADA, THEAD, LINHAS, FOOTER)

function renderUnifiedBarMode() {
    const isSearch = state.barMode === 'search';
    document.getElementById('btn-enter-search').classList.toggle('hidden', isSearch);
    document.getElementById('alpha-strip').classList.toggle('hidden', isSearch);
    document.getElementById('search-mode-field').classList.toggle('hidden', !isSearch);
    document.getElementById('btn-exit-search').classList.toggle('hidden', !isSearch);

    const hasQuery = state.search.trim().length > 0;
    document.getElementById('search-active-dot').classList.toggle('hidden', !hasQuery);
    document.getElementById('btn-clear-search').classList.toggle('visible', hasQuery);
}

function renderApp() {
    const dayKey = getOperationalDayKey();
    const scopePeople = getScopePeople();
    const preLetterPeople = getPreLetterPeople(scopePeople);

    // 1. Atualiza botão 3-estados no cabeçalho (◑ TODOS / ○ FALTAM / ● ENTRARAM)
    const arrivalBtn = document.getElementById('btn-arrival-cycle');
    const arrivalGlyph = document.getElementById('arrival-glyph');
    const arrivalLabel = document.getElementById('arrival-label');
    arrivalBtn.classList.remove('is-pending', 'is-in');

    if (state.arrivalFilter === 'all') {
        arrivalGlyph.textContent = '◑';
        arrivalLabel.textContent = 'TODOS';
    } else if (state.arrivalFilter === 'pending') {
        arrivalGlyph.textContent = '○';
        arrivalLabel.textContent = 'FALTAM';
        arrivalBtn.classList.add('is-pending');
    } else {
        arrivalGlyph.textContent = '●';
        arrivalLabel.textContent = 'ENTRARAM';
        arrivalBtn.classList.add('is-in');
    }

    // 2. Ponto indicador na engrenagem ⚙️ se filtros customizados estiverem ativos
    const hasCustomFilters =
        state.day !== 'all' ||
        state.selectedBuckets.size < ALL_BUCKET_IDS.length ||
        state.turn !== 'all';
    document.getElementById('gear-filter-dot').classList.toggle('hidden', !hasCustomFilters);

    // 3. Barra unificada Busca + Alfabeto
    renderUnifiedBarMode();

    const availableLettersSet = new Set();
    preLetterPeople.forEach(p => availableLettersSet.add(getInitialLetter(p.nome_social)));
    const availableLetters = [...availableLettersSet].sort((a, b) => a.localeCompare(b, 'pt-BR'));

    if (state.letter !== 'ALL' && !availableLettersSet.has(state.letter)) {
        state.letter = 'ALL';
    }

    const alphaStrip = document.getElementById('alpha-strip');
    alphaStrip.innerHTML = `
        <button type="button" class="alpha-chip ${state.letter === 'ALL' ? 'active' : ''}" data-letter="ALL" title="Todas as letras" aria-label="Todas as letras">
            ${SORT_ALPHA_SVG}
        </button>
        ${availableLetters.map(l => `
            <button type="button" class="alpha-chip ${state.letter === l ? 'active' : ''}" data-letter="${l}">${l}</button>
        `).join('')}
    `;

    alphaStrip.querySelectorAll('.alpha-chip').forEach(btn => {
        btn.addEventListener('click', () => {
            state.letter = btn.dataset.letter;
            renderApp();
        });
    });

    // 4. Cabeçalho de colunas sticky
    const acessoCols = getOrderedActiveCols('acesso');
    const mobileTracks = acessoCols.map(c => c.mobileTrack).join(' ');
    const desktopTracks = `${acessoCols.map(c => c.desktopTrack).join(' ')} 124px`;

    const tableHead = document.getElementById('table-head');
    tableHead.style.setProperty('--cols-mobile', mobileTracks);
    tableHead.style.setProperty('--cols-desktop', desktopTracks);
    tableHead.innerHTML = `
        ${acessoCols.map(c => `
            <div class="th-cell ${c.key === 'pronome' ? 'is-center' : ''}">${esc(c.head)}</div>
        `).join('')}
        <div class="th-cell is-desktop-acesso">ACESSO</div>
    `;

    // 5. Renderiza linhas (2 estágios diretos: Stage 0 Padrão <-> Stage 1 Modo Info)
    const visiblePeople = getVisiblePeople(preLetterPeople);
    const rosterList = document.getElementById('roster-list');

    if (!visiblePeople.length) {
        rosterList.innerHTML = `
            <div class="empty-state">
                <div style="margin-bottom:12px;">
                    ${state.arrivalFilter === 'pending' && scopePeople.length > 0 && !state.search.trim()
                        ? 'Todas as pessoas deste recorte já entraram.'
                        : 'Nenhuma pessoa encontrada para os filtros atuais.'
                    }
                </div>
                <button type="button" class="btn" id="btn-empty-reset">Voltar à lista geral</button>
            </div>
        `;
        const resetBtn = document.getElementById('btn-empty-reset');
        if (resetBtn) resetBtn.addEventListener('click', resetAllFilters);
    } else {
        const infoCols = getOrderedActiveCols('info');
        let firstPendingNudge = false;

        rosterList.innerHTML = visiblePeople.map(p => {
            const meta = TEAM_BUCKETS[p.bucket] || { color: '#4fb3d9' };
            const checkedTime = getCheckinTime(p.id, dayKey);
            const isInfoOpen = state.expandedInfoId === p.id;

            let shouldNudge = false;
            if (!state.hasShownSwipeHint && !checkedTime && !firstPendingNudge && !isInfoOpen) {
                shouldNudge = true;
                firstPendingNudge = true;
                state.hasShownSwipeHint = true;
            }

            let innerHtml = '';
            if (!isInfoOpen) {
                // ESTÁGIO 0: Lista compacta + chip de horário à direita no mobile + botão ACESSO no desktop
                const colsHtml = acessoCols.map(c => {
                    if (c.key === 'nome_social') return `<div class="cell-val is-name">${esc(p.nome_social)}</div>`;
                    if (c.key === 'pronome') return `<div class="cell-val is-pronoun">${esc(p.pronome)}</div>`;
                    if (c.key === 'equipe') return `<div class="cell-val is-team">${esc(p.bucket)}</div>`;
                    return `<div class="cell-val is-mono">${esc(getFieldText(p, c.key))}</div>`;
                }).join('');

                innerHtml = `
                    <div class="stage-0" data-toggle-info="${p.id}">
                        <div class="stage-0-cols" style="--cols-mobile:${mobileTracks};--cols-desktop:${desktopTracks};">
                            ${colsHtml}
                            <div class="desktop-acesso-cell">
                                <button type="button" class="acesso-btn ${checkedTime ? 'is-entrou' : 'is-liberar'}" data-desktop-acesso="${p.id}">
                                    ${checkedTime
                                        ? `<span>✓ ENTROU</span><span class="acesso-btn-sub">${esc(checkedTime)}</span>`
                                        : `<span>LIBERAR</span>`
                                    }
                                </button>
                            </div>
                        </div>
                        ${checkedTime ? `<span class="mobile-time-chip">✓ ${esc(checkedTime)}</span>` : ''}
                    </div>
                `;
            } else {
                // ESTÁGIO 1 (1 clique direto): Modo Info com RG, CPF (Nível 2) + botão PERFIL à direita
                const fieldsHtml = infoCols.map(c => `
                    <div class="info-field">
                        <span class="info-field-k">${esc(c.head)}</span>
                        <span class="info-field-v">${esc(getFieldText(p, c.key))}</span>
                    </div>
                `).join('');

                innerHtml = `
                    <div class="stage-1-info" data-toggle-info="${p.id}">
                        <div class="info-left">
                            <div class="info-context-row">
                                <span class="info-context-name">${esc(p.nome_social)}</span>
                                <span class="info-context-team">· ${esc(p.bucket)}</span>
                            </div>
                            <div class="info-fields-strip">${fieldsHtml}</div>
                        </div>
                        <div class="info-right">
                            ${checkedTime ? `<span class="mobile-time-chip">✓ ${esc(checkedTime)}</span>` : ''}
                            <button type="button" class="perfil-btn" data-open-profile="${p.id}">PERFIL</button>
                        </div>
                    </div>

            }

            return `
                <div class="row-shell" style="--tc:${meta.color}" data-shell-id="${p.id}" role="listitem">
                    <div class="swipe-track ${checkedTime ? 'is-undo' : ''}" aria-hidden="true">
                        <span>${checkedTime ? '↩ DESFAZER ENTRADA' : '✓ LIBERAR ENTRADA'}</span>

                    </div>
